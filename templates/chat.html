
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Student Assistant</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #101218;
            --panel: #191c24;
            --border: #303541;
            --text: #f2f3f7;
            --muted: #a8afbd;
            --accent: #7c8cff;
            --user: #303957;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         sans-serif;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 64px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        .brand {
            font-size: 17px;
            font-weight: 700;
        }

        .brand span {
            color: var(--accent);
        }

        button {
            cursor: pointer;
            color: var(--text);
            background: #292e3a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 13px;
            font-size: 14px;
        }

        button:hover {
            background: #383e4d;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        main {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 24px 18px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 22px;
            padding-bottom: 22px;
        }

        .welcome {
            text-align: center;
            margin: auto 0;
            padding: 36px 12px;
        }

        .welcome h1 {
            font-size: clamp(27px, 5vw, 38px);
            margin-bottom: 12px;
        }

        .welcome p {
            color: var(--muted);
            line-height: 1.6;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-width: 100%;
            line-height: 1.7;
        }

        .message.user {
            align-self: flex-end;
            max-width: 85%;
            background: var(--user);
            border-radius: 18px;
            padding: 11px 16px;
        }

        .message.assistant {
            align-self: stretch;
            padding: 2px 3px;
        }

        .label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }

        .content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message.assistant .content {
            min-height: 1.5em;
        }

        .error {
            color: #ff9b9b;
        }

        .composer {
            position: sticky;
            bottom: 0;
            background: var(--bg);
            padding: 10px 0 8px;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border: 1px solid #424858;
            border-radius: 18px;
            padding: 10px;
            background: var(--panel);
        }

        textarea {
            flex: 1;
            min-width: 0;
            max-height: 180px;
            resize: vertical;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text);
            font: inherit;
            line-height: 1.5;
            padding: 8px 4px;
        }

        textarea::placeholder {
            color: #8d95a5;
        }

        #sendButton {
            background: var(--accent);
            color: #101218;
            border: 0;
            font-weight: 700;
            min-width: 65px;
        }

        .hint {
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            margin: 9px 0 0;
        }

        .typing {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 12px;
            }

            main {
                padding: 18px 12px 8px;
            }

            .message.user {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">AI <span>Student Assistant</span></div>
        <button id="clearButton" type="button">New chat</button>
    </header>

    <main>
        <section id="messages" aria-live="polite">
            <div class="welcome" id="welcome">
                <h1>What can I help you learn?</h1>
                <p>
                    Ask about Python, coding, college subjects,
                    projects, or interview preparation.
                </p>
            </div>
        </section>

        <form class="composer" id="chatForm">
            <div class="input-box">
                <textarea
                    id="question"
                    rows="1"
                    maxlength="12000"
                    placeholder="Ask anything..."
                    aria-label="Your question"
                    required
                ></textarea>

                <button id="sendButton" type="submit">Send</button>
            </div>

            <p class="hint">
                AI can make mistakes. Check important information.
            </p>
        </form>
    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("question");
        const messagesElement = document.getElementById("messages");
        const sendButton = document.getElementById("sendButton");
        const clearButton = document.getElementById("clearButton");
        const welcome = document.getElementById("welcome");

        // Store conversation messages for follow-up questions.
        let history = [];
        let busy = false;

        function scrollToBottom() {
            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "auto"
            });
        }

        function addMessage(role, text = "") {
            if (welcome) {
                welcome.remove();
            }

            const wrapper = document.createElement("div");
            wrapper.className = `message ${role}`;

            const label = document.createElement("div");
            label.className = "label";
            label.textContent = role === "user" ? "You" : "AI Assistant";

            const content = document.createElement("div");
            content.className = "content";
            content.textContent = text;

            wrapper.appendChild(label);
            wrapper.appendChild(content);
            messagesElement.appendChild(wrapper);

            scrollToBottom();

            return { wrapper, content };
        }

        function addError(text) {
            const message = addMessage("assistant", text);
            message.content.classList.add("error");
        }

        function setBusy(value) {
            busy = value;
            sendButton.disabled = value;
            input.disabled = value;
            sendButton.textContent = value ? "Wait..." : "Send";
        }

        async function readStream(response, answerElement) {
            if (!response.body) {
                throw new Error("Your browser does not support response streaming.");
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";
            let answer = "";

            function processLine(line) {
                if (!line.trim()) {
                    return null;
                }

                let item;

                try {
                    item = JSON.parse(line);
                } catch {
                    return null;
                }

                if (item.error) {
                    throw new Error(item.error);
                }

                if (typeof item.token === "string") {
                    answer += item.token;
                    answerElement.textContent = answer;
                    scrollToBottom();
                }

                return null;
            }

            while (true) {
                const { value, done } = await reader.read();

                if (done) {
                    break;
                }

                buffer += decoder.decode(value, { stream: true });

                const lines = buffer.split("\n");
                buffer = lines.pop() || "";

                for (const line of lines) {
                    processLine(line);
                }
            }

            buffer += decoder.decode();

            if (buffer.trim()) {
                processLine(buffer);
            }

            return answer;
        }

        async function sendQuestion(question) {
            const previousHistory = history.slice();
            addMessage("user", question);

            const assistantMessage = addMessage("assistant", "");
            const typing = document.createElement("div");
            typing.className = "typing";
            typing.textContent = "Thinking...";
            assistantMessage.wrapper.appendChild(typing);

            setBusy(true);

            try {
                const response = await fetch("/api/assistant", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: question,
                        history: previousHistory
                    })
                });

                if (!response.ok) {
                    let detail = `Request failed (${response.status}).`;

                    try {
                        const data = await response.json();
                        if (data.error) {
                            detail = data.error;
                        }
                    } catch {
                        // Keep the default error message.
                    }

                    throw new Error(detail);
                }

                typing.remove();

                const answer = await readStream(
                    response,
                    assistantMessage.content
                );

                if (!answer.trim()) {
                    throw new Error("The AI returned an empty answer.");
                }

                history.push(
                    { role: "user", content: question },
                    { role: "assistant", content: answer }
                );

                // Keep the latest conversation messages only.
                history = history.slice(-12);

            } catch (error) {
                typing.remove();
                assistantMessage.content.classList.add("error");

                assistantMessage.content.textContent =
                    error.message || "Unable to generate a response.";

            } finally {
                setBusy(false);
                input.focus();
                scrollToBottom();
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (busy) {
                return;
            }

            const question = input.value.trim();

            if (!question) {
                return;
            }

            input.value = "";
            await sendQuestion(question);
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        clearButton.addEventListener("click", () => {
            if (busy) {
                return;
            }

            history = [];
            messagesElement.innerHTML = "";
            messagesElement.appendChild(welcome);
            welcome.style.display = "";
            input.value = "";
            input.focus();
        });
    </script>
</body>
</html>
